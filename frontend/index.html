<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lululeh</title>
        <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<style type="text/tailwindcss">
    @theme {
            --font-sans: 'Inter', sans-serif;
        }
        html {
            scroll-behavior: smooth;  
        }   
        #earth-container {
            width: 100%;
            height: 360px;
        }
    </style>

<body class="w-screen ">
    <div class="w-full  ">

        <nav class="w-full border-b-1 border-gray-800 flex  justify-around py-3  items-center sticky top-0 bg-white z-20">
            <div>
                <img src="asset/logos.jpeg" class="h-12 " alt="">
            </div>
            <a href="#camera">
                <span class="bg-gray-950 px-3 py-2 rounded-full text-md text-white" href="camera">Mulai scan
                    &rarr;</span>
            </a>

        </nav>

        <div class="w-full p-3 flex flex-wrap justify-center items-center  ">
            <div class="max-w-xl mt-5 ">
                <h1 class="font-bold text-6xl m-1 flex">
                    <p class="text-blue-950">LuLu</p>
                    <p class="text-orange-400">Leh</p>
                </h1>
                <h3 class="font-semibold text-3xl mt-2   m-1">Kenali sampah , jaga bumi</h3>
                <p class="mt-10">Scan sampah kamu disini dapatkan informasi pemilahan dan kiat kiat menarik</p>
                <div class="mt-5 full  ">
                    <a href="#camera">
                        <span
                            class="inline-flex items-center gap-2 bg-gray-950 px-4 py-2 rounded-full text-white text-md font-medium tracking-wide shadow-md hover:bg-gray-900 transition-colors cursor-pointer">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-90">
                                <path
                                    d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                                <circle cx="12" cy="13" r="3" />
                            </svg>
                            <span>Mulai scan &rarr;</span>
                        </span>

                    </a>

                </div>
            </div>
            <div class="w-90 h-90 mt-5 ">
                <div id="earth-container" class="w-full h-full"></div>
            </div>
        </div>
        <main id="scanner" class="w-full mt-10 gap-5   p-3 flex flex-wrap  justify-center items-center ">

            <section id="camera-container w-md border-1     ">

                <div>
                    <h3 class="text-xl font-semibold">Buka kamera untuk memindai</h3>
                </div>

                <div id="camera-button" class="border-1 w-full flex mt-4 ">
                    <button id="start-camera" class="w-1/2  p-2 bg-gray-900 text-white">Buka Kamera</button>
                    <button id="capture" class="w-1/2  p-2">Ambil Foto</button>
                </div>

                <div id="preview-container" class="w-full" hidden>

                    <div class="border-1 w-full flex mt-4 ">
                        <button id="scan" class="w-1/2  p-2 bg-gray-900 text-white " disabled>Cek Sampah</button>
                        <button id="retake" class="w-1/2  p-2">Foto Ulang</button>
                    </div>
                    <img id="preview" alt="Preview gambar" class="w-md ">
                </div>
                <video id="camera" class="w-md " autoplay playsinline muted></video>

                <canvas id="canvas" class=" w-md hidden"></canvas>



            </section>
                <div id="result" aria-live="polite" aria-label="Hasil scan" class="w-md  p-2 hidden">


        

                </div>




        </main>
        <div class="w-full flex flex-wrap justify-center items-center gap-5 p-3 mt-10 ">
            <div id="choice" class="w-md  p-2 hidden"> </div>
        </div>
        <footer class=" bottom-0 w-full flex  flex-col justify-center items-center border-t-1 py-6 bg-gray-300 mt-5">
            <p class="text-md ">© 2026 Bali digifest. All Rights Reserved.</p>
            <p class="text-md ">logo by abhii cihuy</p>
        </footer>
    </div>
    
    <script type="module" src="script/camera.js"></script>
    <script type="module" src="script/scan.js"></script>
    <script type="module" src="script/earth.js"></script>
</body>

</html>
